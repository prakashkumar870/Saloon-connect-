<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Salon Connect</title>
<link rel=stylesheet href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--bg:#f6f3ff;--card:#fff;--tx:#1e1b2e;--mu:#6b6785;--pr:#7c3aed;--pr2:#ec4899;--bd:#e8e4f5;--ok:#16a34a}
@media(prefers-color-scheme:dark){:root{--bg:#0f0d1a;--card:#1a1730;--tx:#f1eefc;--mu:#a9a3c7;--bd:#2c2850}}
*{box-sizing:border-box}body{font:16px system-ui,sans-serif;margin:0;background:var(--bg);color:var(--tx)}
#app{max-width:560px;margin:auto;padding:0 14px 30px}
h1{margin:0;font-size:30px}h2{margin:18px 0 8px;font-size:22px}h3{margin:8px 0}
.hero{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;margin:0 -14px 16px;padding:34px 20px 28px;border-radius:0 0 28px 28px;box-shadow:0 8px 24px #7c3aed44}
.hero p{margin:6px 0 0;opacity:.9}
input,select{width:100%;font:inherit;padding:13px 14px;margin:5px 0;border:1.5px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);outline:0}
input:focus,select:focus{border-color:var(--pr);box-shadow:0 0 0 3px #7c3aed22}
button{width:100%;font:inherit;font-weight:600;padding:13px;margin:5px 0;border:0;border-radius:12px;color:#fff;background:linear-gradient(135deg,var(--pr),var(--pr2));box-shadow:0 4px 12px #7c3aed33;cursor:pointer}
button:active{transform:scale(.98)}
button.ghost{background:transparent;color:var(--mu);box-shadow:none;border:1.5px solid var(--bd)}
#gps{padding:16px;font-size:17px}#sq{background:var(--card);color:var(--pr);border:1.5px solid var(--pr);box-shadow:none}
a button{background:linear-gradient(135deg,#16a34a,#22c55e)}
.c{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin:12px 0;box-shadow:0 4px 16px #00000010}
[data-i]{cursor:pointer}[data-i]:active{transform:scale(.99)}
#map,#pick{height:300px;border-radius:18px;margin:10px 0;box-shadow:0 4px 16px #00000020;z-index:0}
img{width:100%;height:150px;object-fit:cover;border-radius:12px;margin-bottom:8px}
.m{color:var(--mu);font-size:14px;margin:4px 0}
#st{padding:10px 12px;background:var(--card);border-radius:12px;border:1px dashed var(--bd);margin:8px 0}#st:empty{display:none}
.badge{display:inline-block;background:#7c3aed1f;color:var(--pr);font-weight:700;font-size:13px;padding:3px 10px;border-radius:99px}
.chip{display:inline-block;background:var(--bg);border:1px solid var(--bd);border-radius:99px;padding:5px 11px;margin:4px 4px 0 0;font-size:14px}
button[data-d]{width:auto;padding:2px 10px;margin:0 0 0 6px;background:#ef4444;box-shadow:none}
</style>
<div id=app></div>
<script>
const $=s=>document.querySelector(s),A=$('#app'),esc=t=>String(t??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
let tok=localStorage.tok,user=JSON.parse(localStorage.user||'null'),loc=null;
const api=async(p,m='GET',b)=>{const r=await fetch('/api'+p,{method:m,headers:{'Content-Type':'application/json',...(tok&&{Authorization:'Bearer '+tok})},body:b&&JSON.stringify(b)});const j=await r.json();if(!r.ok)throw Error(j.error||'Error');return j};
const out=()=>{localStorage.clear();tok=user=null;home()};
const tiles=m=>L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(m);
const geo=async q=>(await(await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=in&q='+encodeURIComponent(q))).json())[0];
// Google Maps directions; origin only when the customer's real GPS position is known
const dir=s=>'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(s.lat+','+s.lng)+(loc&&loc.gps?'&origin='+encodeURIComponent(loc.lat+','+loc.lng):'');
function home(){!user?authUI():user.role=='customer'?customer():user.role=='owner'?owner():admin()}
function authUI(){A.innerHTML=`<div class=hero><h1>💈 Salon Connect</h1><p>Apne paas ka best salon dhoondhein</p></div><input id=n placeholder="Name (register only)"><input id=e type=email placeholder=Email><input id=p type=password placeholder="Password (min 8)"><select id=ro><option value=customer>I am a customer<option value=owner>I own a salon</select><button id=li>Login</button><button id=rg>Register</button><div id=er style=color:red></div>`;
const go=reg=>async()=>{try{const j=await api(reg?'/register':'/login','POST',{name:$('#n').value,email:$('#e').value,password:$('#p').value,role:$('#ro').value});tok=localStorage.tok=j.token;user=j.user;localStorage.user=JSON.stringify(user);home()}catch(x){$('#er').textContent=x.message}};$('#li').onclick=go(0);$('#rg').onclick=go(1)}
function customer(){A.innerHTML=`<h2>✨ Nearby salons</h2><button id=gps>📍 Use My Current Location</button><input id=q placeholder="City, area or PIN code"><button id=sq>Search area</button><select id=r><option value=2>Within 2 km<option value=5 selected>Within 5 km<option value=10>Within 10 km<option value=20>Within 20 km</select><div id=st class=m></div><div id=map></div><div id=list></div><div id=det></div><button class=ghost onclick=out()>Logout</button>`;
const map=L.map('map').setView([20.59,78.96],4);tiles(map);const lg=L.layerGroup().addTo(map);let list=[];
const back=()=>{$('#det').innerHTML='';$('#list').innerHTML=list.map((s,i)=>`<div class=c data-i=${i}>${s.image?`<img src="${esc(s.image)}">`:''}<b>${esc(s.name)}</b><span class=badge>📍 ${s.distance} km</span><div class=m>${esc(s.address)}, ${esc(s.city)}<br>🕒 ${esc(s.hours)}</div>${s.services.map(v=>`<span class=chip>${esc(v.name)} ₹${v.price}</span>`).join('')}</div>`).join('');document.querySelectorAll('[data-i]').forEach(d=>d.onclick=()=>show(list[d.dataset.i]))};
const show=s=>{map.setView([s.lat,s.lng],16);$('#list').innerHTML='';$('#det').innerHTML=`<div class=c><h3>${esc(s.name)}</h3>${s.image?`<img src="${esc(s.image)}">`:''}<p>${esc(s.address)}, ${esc(s.city)} ${esc(s.pin)}</p><p><span class=badge>📍 ${s.distance} km</span> 🕒 ${esc(s.hours)}</p>${s.services.map(v=>`<span class=chip>${esc(v.name)} ₹${v.price}</span>`).join('')||'<div class=m>No services listed</div>'}<a href="${dir(s)}" target=_blank rel=noopener><button>🧭 Get Directions</button></a><button class=ghost id=bk>← Back to salon list</button></div>`;$('#bk').onclick=()=>{back();map.fitBounds(L.latLngBounds([[loc.lat,loc.lng],...list.map(x=>[x.lat,x.lng])]).pad(.2))}};
const find=async()=>{$('#st').textContent='Loading salons…';$('#list').innerHTML=$('#det').innerHTML='';lg.clearLayers();
try{list=await api(`/nearby?lat=${loc.lat}&lng=${loc.lng}&radius=${$('#r').value}`);L.circleMarker([loc.lat,loc.lng],{radius:8,color:'#2563eb'}).addTo(lg).bindPopup(loc.gps?'You are here':'Searched area');
list.forEach(s=>L.marker([s.lat,s.lng]).addTo(lg).bindPopup(esc(s.name)).on('click',()=>show(s)));
$('#st').textContent=list.length?list.length+' salon(s) found, nearest first':'No approved salons within '+$('#r').value+' km. Try a larger distance.';
map.fitBounds(L.latLngBounds([[loc.lat,loc.lng],...list.map(s=>[s.lat,s.lng])]).pad(.2));back()}catch(x){$('#st').textContent='Error: '+x.message}};
$('#gps').onclick=()=>{if(!navigator.geolocation){$('#st').textContent='Location not supported. Use area search.';return}$('#st').textContent='Getting your location…';
navigator.geolocation.getCurrentPosition(p=>{loc={lat:p.coords.latitude,lng:p.coords.longitude,gps:true};find()},e=>{$('#st').textContent=(e.code==1?'Location permission denied.':'Could not get your location.')+' Please search by city, area or PIN code.'},{enableHighAccuracy:true,timeout:15000})};
$('#sq').onclick=async()=>{const q=$('#q').value.trim();if(!q)return;$('#st').textContent='Finding area…';try{const g=await geo(q);if(!g){$('#st').textContent='Area not found. Try another name or PIN.';return}loc={lat:+g.lat,lng:+g.lon,gps:false};find()}catch{$('#st').textContent='Area search failed. Check internet.'}};
$('#r').onchange=()=>loc&&find()}
async function owner(){const s=await api('/my-salon');
A.innerHTML=`<h2>💈 My salon</h2><div class=m>${s.approved?'✅ Approved':'⏳ Pending Super Admin approval'} · Subscription: ${s.sub_until?'until '+esc(s.sub_until):'not active'}</div>`+['name','image','address','city','pin','hours'].map(k=>`<input id=f_${k} placeholder="${k}${k=='image'?' (https link)':k=='pin'?' (6 digits)':''}" value="${esc(s[k])}">`).join('')+`<input id=f_lat placeholder=latitude value="${s.lat??''}"><input id=f_lng placeholder=longitude value="${s.lng??''}"><button id=fa>Find address on map</button><div id=pick></div><div class=m>Tap the map or drag the pin to your real salon location.</div><button id=sv>Save salon</button><div id=msg class=m></div><h3>Services</h3>`+s.services.map(v=>`<div>${esc(v.name)} ₹${v.price} <button data-d=${v.id} style=width:auto>✕</button></div>`).join('')+`<input id=sn placeholder="Service name"><input id=sp type=number placeholder=Price><button id=sa>Add service</button><button class=ghost onclick=out()>Logout</button>`;
const m=L.map('pick').setView(s.lat!=null?[s.lat,s.lng]:[20.59,78.96],s.lat!=null?16:4);tiles(m);let mk;
const put=(a,b)=>{$('#f_lat').value=(+a).toFixed(6);$('#f_lng').value=(+b).toFixed(6);if(mk)mk.setLatLng([a,b]);else mk=L.marker([a,b],{draggable:true}).addTo(m).on('dragend',()=>{const p=mk.getLatLng();put(p.lat,p.lng)})};
if(s.lat!=null)put(s.lat,s.lng);m.on('click',e=>put(e.latlng.lat,e.latlng.lng));
$('#fa').onclick=async()=>{const g=await geo(['address','city','pin'].map(k=>$('#f_'+k).value).filter(Boolean).join(', '));if(!g)return $('#msg').textContent='Address not found. Tap the map instead.';put(+g.lat,+g.lon);m.setView([+g.lat,+g.lon],17)};
$('#sv').onclick=async()=>{try{const b={};['name','image','address','city','pin','hours','lat','lng'].forEach(k=>b[k]=$('#f_'+k).value);const j=await api('/my-salon','PUT',b);$('#msg').textContent='Saved.'+(j.reapproval?' Location/address changed: needs Super Admin re-approval.':'')}catch(x){$('#msg').textContent=x.message}};
$('#sa').onclick=async()=>{try{await api('/my-salon/services','POST',{name:$('#sn').value,price:$('#sp').value});owner()}catch(x){$('#msg').textContent=x.message}};
document.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{await api('/my-salon/services/'+b.dataset.d,'DELETE');owner()})}
async function admin(){const l=await api('/admin/salons');A.innerHTML='<h2>🛡️ Super Admin</h2>'+l.map(s=>`<div class=c><b>${esc(s.name)}</b> <span class=m>${esc(s.owner)}</span><div class=m>${esc(s.address)}, ${esc(s.city)} · ${s.lat!=null?s.lat+', '+s.lng:'no location'}<br>Approved: ${!!s.approved} · Active: ${!!s.active} · Subscription until: ${esc(s.sub_until||'none')}</div><button data-id=${s.id} data-a='{"approved":${!s.approved}}'>${s.approved?'Unapprove':'Approve'}</button><button data-id=${s.id} data-a='{"active":${!s.active}}'>${s.active?'Deactivate':'Activate'}</button><button data-id=${s.id} data-a='{"extend":1}'>+30 days subscription</button></div>`).join('')+'<button class=ghost onclick=out()>Logout</button>';
document.querySelectorAll('[data-a]').forEach(b=>b.onclick=async()=>{try{await api('/admin/salons/'+b.dataset.id,'POST',JSON.parse(b.dataset.a));admin()}catch(x){alert(x.message)}})}
home();
  </script>
