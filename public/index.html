<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Salon Connect</title>
<link rel=stylesheet href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>body{font:16px system-ui;margin:auto;padding:12px;max-width:640px}input,select,button{font:inherit;padding:10px;margin:3px 0;width:100%;box-sizing:border-box}button{background:#7c3aed;color:#fff;border:0;border-radius:8px}.c{border:1px solid #ddd;border-radius:10px;padding:10px;margin:8px 0}#map,#pick{height:300px;border-radius:10px}img{max-width:100%;border-radius:8px}.m{color:#666;font-size:14px}</style>
<div id=app></div>
<script>
const $=s=>document.querySelector(s),A=$('#app'),esc=t=>String(t??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
let tok=localStorage.tok,user=JSON.parse(localStorage.user||'null'),loc=null;
const api=async(p,m='GET',b)=>{const r=await fetch('/api'+p,{method:m,headers:{'Content-Type':'application/json',...(tok&&{Authorization:'Bearer '+tok})},body:b&&JSON.stringify(b)});const j=await r.json();if(!r.ok)throw Error(j.error||'Error');return j};
const out=()=>{localStorage.clear();tok=user=null;home()};
const tiles=m=>L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(m);
const geo=async q=>(await(await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=in&q='+encodeURIComponent(q))).json())[0];
// Google Maps directions; origin only when the customer's real GPS position is known
const dir=s=>'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(s.lat+','+s.lng)+(loc&&loc.gps?'&origin='+encodeURIComponent(loc.lat+','+loc.lng):'');
function home(){!user?authUI():user.role=='customer'?customer():user.role=='owner'?owner():admin()}
function authUI(){A.innerHTML=`<h1>💈 Salon Connect</h1><input id=n placeholder="Name (register only)"><input id=e type=email placeholder=Email><input id=p type=password placeholder="Password (min 8)"><select id=ro><option value=customer>I am a customer<option value=owner>I own a salon</select><button id=li>Login</button><button id=rg>Register</button><div id=er style=color:red></div>`;
const go=reg=>async()=>{try{const j=await api(reg?'/register':'/login','POST',{name:$('#n').value,email:$('#e').value,password:$('#p').value,role:$('#ro').value});tok=localStorage.tok=j.token;user=j.user;localStorage.user=JSON.stringify(user);home()}catch(x){$('#er').textContent=x.message}};$('#li').onclick=go(0);$('#rg').onclick=go(1)}
function customer(){A.innerHTML=`<h2>Nearby salons</h2><button id=gps>📍 Use My Current Location</button><input id=q placeholder="City, area or PIN code"><button id=sq>Search area</button><select id=r><option value=2>Within 2 km<option value=5 selected>Within 5 km<option value=10>Within 10 km<option value=20>Within 20 km</select><div id=st class=m></div><div id=map></div><div id=list></div><div id=det></div><button onclick=out()>Logout</button>`;
const map=L.map('map').setView([20.59,78.96],4);tiles(map);const lg=L.layerGroup().addTo(map);let list=[];
const back=()=>{$('#det').innerHTML='';$('#list').innerHTML=list.map((s,i)=>`<div class=c data-i=${i}>${s.image?`<img src="${esc(s.image)}">`:''}<b>${esc(s.name)}</b><div class=m>${s.distance} km · ${esc(s.address)}, ${esc(s.city)}<br>${esc(s.hours)}</div>${s.services.map(v=>`<div>${esc(v.name)} ₹${v.price}</div>`).join('')}</div>`).join('');document.querySelectorAll('[data-i]').forEach(d=>d.onclick=()=>show(list[d.dataset.i]))};
const show=s=>{map.setView([s.lat,s.lng],16);$('#list').innerHTML='';$('#det').innerHTML=`<div class=c><h3>${esc(s.name)}</h3>${s.image?`<img src="${esc(s.image)}">`:''}<p>${esc(s.address)}, ${esc(s.city)} ${esc(s.pin)}</p><p>${s.distance} km · ${esc(s.hours)}</p>${s.services.map(v=>`<div>${esc(v.name)} — ₹${v.price}</div>`).join('')||'<div class=m>No services listed</div>'}<a href="${dir(s)}" target=_blank rel=noopener><button>Get Directions</button></a><button id=bk>← Back to salon list</button></div>`;$('#bk').onclick=()=>{back();map.fitBounds(L.latLngBounds([[loc.lat,loc.lng],...list.map(x=>[x.lat,x.lng])]).pad(.2))}};
const find=async()=>{$('#st').textContent='Loading salons…';$('#list').innerHTML=$('#det').innerHTML='';lg.clearLayers();
try{list=await api(`/nearby?lat=${loc.lat}&lng=${loc.lng}&radius=${$('#r').value}`);L.circleMarker([loc.lat,loc.lng],{radius:8,color:'#2563eb'}).addTo(lg).bindPopup(loc.gps?'You are here':'Searched area');
list.forEach(s=>L.marker([s.lat,s.lng]).addTo(lg).bindPopup(esc(s.name)).on('click',()=>show(s)));
$('#st').textContent=list.length?list.length+' salon(s) found, nearest first':'No approved salons within '+$('#r').value+' km. Try a larger distance.';
map.fitBounds(L.latLngBounds([[loc.lat,loc.lng],...list.map(s=>[s.lat,s.lng])]).pad(.2));back()}catch(x){$('#st').textContent='Error: '+x.message}};
$('#gps').onclick=()=>{if(!navigator.geolocation){$('#st').textContent='Location not supported. Use area search.';return}$('#st').textContent='Getting your location…';
navigator.geolocation.getCurrentPosition(p=>{loc={lat:p.coords.latitude,lng:p.coords.longitude,gps:true};find()},e=>{$('#st').textContent=(e.code==1?'Location permission denied.':'Could not get your location.')+' Please search by city, area or PIN code.'},{enableHighAccuracy:true,timeout:15000})};
$('#sq').onclick=async()=>{const q=$('#q').value.trim();if(!q)return;$('#st').textContent='Finding area…';try{const g=await geo(q);if(!g){$('#st').textContent='Area not found. Try another name or PIN.';return}loc={lat:+g.lat,lng:+g.lon,gps:false};find()}catch{$('#st').textContent='Area search failed. Check internet.'}};
$('#r').onchange=()=>loc&&find()}
async function owner(){const s=await api('/my-salon');
A.innerHTML=`<h2>My salon</h2><div class=m>${s.approved?'✅ Approved':'⏳ Pending Super Admin approval'} · Subscription: ${s.sub_until?'until '+esc(s.sub_until):'not active'}</div>`+['name','image','address','city','pin','hours'].map(k=>`<input id=f_${k} placeholder="${k}${k=='image'?' (https link)':k=='pin'?' (6 digits)':''}" value="${esc(s[k])}">`).join('')+`<input id=f_lat placeholder=latitude value="${s.lat??''}"><input id=f_lng placeholder=longitude value="${s.lng??''}"><button id=fa>Find address on map</button><div id=pick></div><div class=m>Tap the map or drag the pin to your real salon location.</div><button id=sv>Save salon</button><div id=msg class=m></div><h3>Services</h3>`+s.services.map(v=>`<div>${esc(v.name)} ₹${v.price} <button data-d=${v.id} style=width:auto>✕</button></div>`).join('')+`<input id=sn placeholder="Service name"><input id=sp type=number placeholder=Price><button id=sa>Add service</button><button onclick=out()>Logout</button>`;
const m=L.map('pick').setView(s.lat!=null?[s.lat,s.lng]:[20.59,78.96],s.lat!=null?16:4);tiles(m);let mk;
const put=(a,b)=>{$('#f_lat').value=(+a).toFixed(6);$('#f_lng').value=(+b).toFixed(6);if(mk)mk.setLatLng([a,b]);else mk=L.marker([a,b],{draggable:true}).addTo(m).on('dragend',()=>{const p=mk.getLatLng();put(p.lat,p.lng)})};
if(s.lat!=null)put(s.lat,s.lng);m.on('click',e=>put(e.latlng.lat,e.latlng.lng));
$('#fa').onclick=async()=>{const g=await geo(['address','city','pin'].map(k=>$('#f_'+k).value).filter(Boolean).join(', '));if(!g)return $('#msg').textContent='Address not found. Tap the map instead.';put(+g.lat,+g.lon);m.setView([+g.lat,+g.lon],17)};
$('#sv').onclick=async()=>{try{const b={};['name','image','address','city','pin','hours','lat','lng'].forEach(k=>b[k]=$('#f_'+k).value);const j=await api('/my-salon','PUT',b);$('#msg').textContent='Saved.'+(j.reapproval?' Location/address changed: needs Super Admin re-approval.':'')}catch(x){$('#msg').textContent=x.message}};
$('#sa').onclick=async()=>{try{await api('/my-salon/services','POST',{name:$('#sn').value,price:$('#sp').value});owner()}catch(x){$('#msg').textContent=x.message}};
document.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{await api('/my-salon/services/'+b.dataset.d,'DELETE');owner()})}
async function admin(){const l=await api('/admin/salons');A.innerHTML='<h2>Super Admin</h2>'+l.map(s=>`<div class=c><b>${esc(s.name)}</b> <span class=m>${esc(s.owner)}</span><div class=m>${esc(s.address)}, ${esc(s.city)} · ${s.lat!=null?s.lat+', '+s.lng:'no location'}<br>Approved: ${!!s.approved} · Active: ${!!s.active} · Subscription until: ${esc(s.sub_until||'none')}</div><button data-id=${s.id} data-a='{"approved":${!s.approved}}'>${s.approved?'Unapprove':'Approve'}</button><button data-id=${s.id} data-a='{"active":${!s.active}}'>${s.active?'Deactivate':'Activate'}</button><button data-id=${s.id} data-a='{"extend":1}'>+30 days subscription</button></div>`).join('')+'<button onclick=out()>Logout</button>';
document.querySelectorAll('[data-a]').forEach(b=>b.onclick=async()=>{try{await api('/admin/salons/'+b.dataset.id,'POST',JSON.parse(b.dataset.a));admin()}catch(x){alert(x.message)}})}
home();
                          </script>
